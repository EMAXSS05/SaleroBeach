services:
  api_rest: 
    build: ./backend
    container_name: backend-salero-beach 
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend/uploads:/app/uploads

  web-app: 
    build: ./frontend
    container_name: react-salero-beach
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app          
      - /app/node_modules
    depends_on:
      - api_rest